note: >-
  SpringServe runs v0 and v1 concurrently and says so in both specs, but publishes NO
  deprecation policy, NO sunset date for v0, NO SLA and NO public status page. That is the
  finding. v0 is not marked deprecated anywhere — zero operations in either document carry
  `deprecated: true` — so a consumer has no machine-readable or documented signal about when
  the older version goes away, only the statement that v1 coverage is still being built out.
  status.magnite.com and status.springserve.com do not resolve; magnite.statuspage.io and
  springserve.statuspage.io return the generic Statuspage.io marketing page (identical
  127,719-byte body for both), which is not a Magnite status page and is recorded as a miss.
