note: >-
  Magnite ships first-party client libraries under two brands. The SpringServe Python
  library wraps the SpringServe UI API (v0/v1) at console.springserve.com and is the only
  server-side SDK; its PyPI summary is literally "API Library for console.springserve.com",
  which independently corroborates the API base host. The in-app advertising SDK is a mobile
  ad-rendering SDK (Android via Maven Central, iOS via CocoaPods) — it is not a client for the
  SpringServe REST API. No npm, RubyGems, NuGet, Go, Packagist or crates.io package exists for
  either brand (all probed, 404).
