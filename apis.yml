apis:
- name: SpringServe UI API
  description: 'The SpringServe ad server REST API — the machine-readable core of Magnite Streaming. Two
    versions run concurrently: v0 (289 operations, 173 paths) and v1 (379 operations, 295 paths, 139 component
    schemas). Covers supply tags and supply routers (publisher inventory), demand tags (buyer demand),
    creatives across video/audio/tile/tag formats, deal lists and curated marketplaces, partner segments
    and audiences, targeting lists (geo, domain, app bundle, IP, postal code, ISP), forecasting, dashboards,
    a synchronous and asynchronous reporting engine with saved templates and schedules, and a first-class
    object-change audit log. Authentication is a token or JWT bearer minted at POST /api/v{0,1}/auth;
    there is no OAuth and no scope surface. Both OpenAPI 3.1.2 documents are served anonymously from the
    Swagger UI at https://api.springserve.com/api-docs.'
