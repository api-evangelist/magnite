note: >-
  SpringServe publishes hard numeric limits in the API Getting Started page. It does NOT
  publish rate-limit response headers, and none were observed on live unauthenticated
  requests to https://console.springserve.com/api/v1/accounts on 2026-08-13 (response
  carried only content-type, server, x-request-id, x-runtime and
  strict-transport-security). The status code returned on exhaustion is not documented.
  For an agent this is the weak half of the signal: the numbers are knowable in advance but
  there is no runtime feedback loop, so a client must budget locally rather than react to a
  header.
